<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111C33" />
      <stop offset="60%" stop-color="#090E1B" />
      <stop offset="100%" stop-color="#050810" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="120" y1="390" x2="392" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="256" y1="90" x2="400" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Obsidian App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Subtle Precision Geometric Grid Ring -->
  <polygon
    points="256,64 392,120 448,256 392,392 256,448 120,392 64,256 120,120"
    stroke="#1E293B"
    stroke-width="2.5"
    fill="none"
  />

  <!-- Left & Right Algorithmic Pillars (Quantitative Candlesticks) -->
  <rect x="136" y="256" width="32" height="92" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <rect x="148" y="220" width="8" height="36" rx="4" fill="#475569" />

  <rect x="202" y="210" width="32" height="138" rx="10" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6" stroke-width="2" />
  <rect x="214" y="172" width="8" height="38" rx="4" fill="#10B981" />

  <!-- Precision Ascending Confluence Trajectory -->
  <path
    d="M126 324 L218 246 L278 282 L374 164"
    stroke="url(#emeraldGrad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Gold Apex Directional Vector Head -->
  <path
    d="M320 156 L388 148 L380 216"
    stroke="url(#amberGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Institutional Diamond Anchor -->
  <polygon
    points="278,258 302,282 278,306 254,282"
    fill="#070B14"
    stroke="#F59E0B"
    stroke-width="6"
  />
</svg>
